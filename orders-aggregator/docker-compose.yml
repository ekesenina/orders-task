services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Внешний API заказов (поддерживается другой командой). Образ приложен к заданию: docker load -i orders-mock-*.tar.gz
  orders-api:
    image: orders-mock:3
    ports:
      - "${ORDERS_API_PORT:-4000}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
